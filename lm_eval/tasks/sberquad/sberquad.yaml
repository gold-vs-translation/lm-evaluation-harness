tag: sberquad
task: sberquad
dataset_path: kuznetsoffandrey/sberquad
output_type: generate_until
test_split: test
doc_to_text: "Контекст: {{context}}\n\nВопрос: {{question}}\n\nОтвет:"
doc_to_target: '{{answers["text"][0]}}'
process_results: !function utils.process_results_qa
target_delimiter: ' '
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
