include: "_default_template_yaml"
tag:
  - french_bench
  - french_bench_gen
task: french_bench_fquadv2_hasAns_plain
dataset_path: manu/fquad2_test
output_type: generate_until
validation_split: valid_hasAns
test_split: test_hasAns
fewshot_split: valid_hasAns
doc_to_text: "Contexte: {{context}}\n\nQuestion: {{question}}\n\nRéponse:"
doc_to_target: "{{answers.text[0]}}"
target_delimiter: " "
should_decontaminate: true
doc_to_decontamination_query: context
generation_kwargs:
  until:
    - "\n"
metric_list:
  - metric: !function utils.exact
    aggregation: mean
    higher_is_better: true
