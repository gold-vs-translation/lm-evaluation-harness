task: nqii
dataset_path: gold-vs-trans/icelandic-qa-NQiI
dataset_name: icelandic-qa-NQiI
output_type: generate_until
training_split: train
validation_split: validation
doc_to_text: "Samhengi: {{context}}\n\nSpurning: {{question}}\n\nSvar:"
doc_to_target: '{{answers["text"][0]}}'
process_results: !function utils.process_results_qa
target_delimiter: ' '
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
